                  </div>
                  <button class="scroll-btn right-arrow" aria-label="Scroll tags right"></button>
               </div>

               <div class="image-container" data-testid="paintings-grid">
                  <!-- cards injected by paintings.js -->
               </div>
            </div>
         </section>

         <section id="publications">
            <div class="content">
               <h2>My Publications</h2>

      <!-- ===== Fullscreen lightbox ===== -->
      <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" data-testid="lightbox">
         <button class="lb-icon-btn lb-close" data-close-modal aria-label="Close" data-testid="lightbox-close">
            <i class="fas fa-times"></i>
         </button>
         <button id="lightbox-prev" class="lb-nav lb-nav-prev" aria-label="Previous painting" data-testid="lightbox-prev">
            <i class="fas fa-chevron-left"></i>
         </button>
         <button id="lightbox-next" class="lb-nav lb-nav-next" aria-label="Next painting" data-testid="lightbox-next">
            <i class="fas fa-chevron-right"></i>
         </button>

         <div class="lb-stage">
            <img id="lightbox-img" class="lb-image" alt="" data-testid="lightbox-image"/>
            <span class="lb-watermark" aria-hidden="true" data-testid="lightbox-watermark">Prativa on Canvas</span>
         </div>

         <div class="lb-footer">
            <div class="lb-meta">
               <span id="lightbox-title" class="lb-title" data-testid="lightbox-title"></span>
               <span id="lightbox-counter" class="lb-counter" data-testid="lightbox-counter"></span>
            </div>
            <button id="lightbox-info-btn" class="lb-info-btn" data-testid="lightbox-info-btn">
               <i class="fas fa-info-circle"></i> View details
            </button>
         </div>

         <div id="lightbox-thumbs" class="lb-thumbs"></div>
      </div>
