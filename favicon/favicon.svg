<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prativa">
   <title>Prativa</title>
   <defs>
      <linearGradient id="favRing" x1="0%" y1="0%" x2="100%" y2="100%">
         <stop offset="0%"   stop-color="#b65a3c"/>
         <stop offset="100%" stop-color="#b78a44"/>
      </linearGradient>
      <linearGradient id="favInk" x1="0%" y1="0%" x2="0%" y2="100%">
         <stop offset="0%"   stop-color="#1c1f2a"/>
         <stop offset="100%" stop-color="#8b3e22"/>
      </linearGradient>
   </defs>

   <!-- Solid terracotta-gold disc for sharp favicon presence -->
   <circle cx="32" cy="32" r="31" fill="url(#favRing)"/>

   <!-- Ivory inner disc -->
   <circle cx="32" cy="32" r="27" fill="#f7f1e3"/>

   <!-- 'P' monogram, larger for visibility at 16px -->
   <path d="M24 16
            L31 16
            Q44 16 44 26
            Q44 36 31 36
            L26 36
            L26 50"
         fill="none"
         stroke="url(#favInk)"
         stroke-width="5"
         stroke-linecap="round"
         stroke-linejoin="round"/>

   <!-- Paint dot accent -->
   <circle cx="45" cy="19" r="2.6" fill="#b65a3c"/>
</svg>
