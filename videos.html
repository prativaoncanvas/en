<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Videos - Prativa on Canvas</title>
      <link rel="stylesheet" href="css/styles.css">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
      <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
      <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
      <link rel="shortcut icon" href="favicon/favicon.ico" />
      <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
      <link rel="manifest" href="favicon/site.webmanifest" />
      <script src="scripts/header.js"></script>
      <script src="scripts/videos.js"></script>
      <script src="scripts/footer.js"></script>
   </head>
   <body>
      <div id="header-container"></div>
      <main>
         <section id="videos">
            <div class="content">
               <h1>My Videos</h1>

               <div class="video-player-wrap" data-testid="video-player-wrap">
                  <div class="video-main" data-testid="video-main">
                     <div class="video-frame">
                        <iframe
                           id="main-video-iframe"
                           data-testid="main-video-iframe"
                           src=""
                           title="YouTube video player"
                           frameborder="0"
                           allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                           referrerpolicy="strict-origin-when-cross-origin"
                           allowfullscreen>
                        </iframe>
                     </div>
                     <div class="video-now-playing">
                        <span class="badge" data-testid="now-playing-badge">Now playing</span>
                        <h2 id="main-video-title" data-testid="main-video-title">Loading…</h2>
                        <p id="main-video-meta" data-testid="main-video-meta">Prativa on Canvas · YouTube</p>
                     </div>
                  </div>

                  <aside class="video-playlist" data-testid="video-playlist">
                     <div class="playlist-header">
                        <h3>Up next</h3>
                        <span class="count" id="playlist-count" data-testid="playlist-count"></span>
                     </div>
                     <div class="playlist-scroll" id="playlist-scroll" data-testid="playlist-scroll">
                        <!-- playlist items injected by videos.js -->
                     </div>
                  </aside>
               </div>
            </div>
         </section>
      </main>
      <footer>
         <p></p>
      </footer>
   </body>
</html>
