<!DOCTYPE html>

   <head>
      <meta charset="UTF-8" />

      <title>চিত্রকর্ম — প্রতিভার ক্যানভাস | জলরঙ, অ্যাক্রিলিক, প্যাস্টেল ও পেন্সিল গ্যালারি</title>
      <meta name="description" content="প্রতিভা দেবশর্মার চিত্রকর্মের গ্যালারি — জলরঙ, অ্যাক্রিলিক, প্যাস্টেল, পেন্সিল ও স্কেচ। মাধ্যম অনুযায়ী ফিল্টার করুন এবং প্রতিটি চিত্রকর্ম পূর্ণস্ক্রিনে বিস্তারিত তথ্যসহ দেখুন।" />
      <meta name="keywords" content="প্রতিভা দেবশর্মা চিত্রকর্ম, জলরঙ গ্যালারি, অ্যাক্রিলিক পেইন্টিং, প্যাস্টেল আর্ট, পেন্সিল স্কেচ, বাঙালি শিল্পী গ্যালারি" />
      <meta name="author" content="প্রতিভা দেবশর্মা" />
      <meta name="robots" content="index, follow" />
      <link rel="canonical" href="https://prativaoncanvas.com/bn/paintings.html" />
      <link rel="alternate" hreflang="en" href="https://prativaoncanvas.com/paintings.html" />
      <link rel="alternate" hreflang="bn" href="https://prativaoncanvas.com/bn/paintings.html" />

      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="প্রতিভার ক্যানভাস" />
      <meta property="og:title" content="চিত্রকর্ম · প্রতিভার ক্যানভাস" />
      <meta property="og:description" content="প্রতিভা দেবশর্মার জলরঙ, অ্যাক্রিলিক, প্যাস্টেল ও পেন্সিল কাজের গ্যালারি।" />
      <meta property="og:image" content="https://prativaoncanvas.com/arts/art-1.jpg" />
      <meta property="og:url" content="https://prativaoncanvas.com/bn/paintings.html" />

      <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
      <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
      <link rel="shortcut icon" href="/favicon/favicon.ico" />
      <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
      <link rel="manifest" href="/favicon/site.webmanifest" />

      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@400;500;600;700;800&family=Pinyon+Script&family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla:ital@0;1&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
      <link rel="stylesheet" href="/css/styles.css" />
      <link rel="stylesheet" href="/css/bn.css" />

      <script src="/scripts/header.js"></script>
      <script src="/scripts/paintings.js"></script>
      <script src="/scripts/art-filter.js"></script>
      <script src="/scripts/lightbox.js"></script>
      <script src="/scripts/footer.js"></script>
   </head>
   <body>
      <div id="header-container"></div>
      <main>
         <section id="paintings">
            <div class="content">
               <h1>আমার চিত্রকর্ম</h1>

               <p class="filter-hint" data-testid="filter-hint">
                  ট্যাগ অনুযায়ী ফিল্টার করুন। গ্যালারি ও বিস্তারিত তথ্যের জন্য <i class="fas fa-info-circle"></i> এ ক্লিক করুন।
               </p>

               <div class="tag-scroll-container">
                  <button class="scroll-btn left-arrow" aria-label="ট্যাগ বাঁদিকে স্ক্রল"></button>
                  <div class="tag-container" data-testid="tag-container">
                     <button class="tag active" data-tag="all" data-testid="tag-filter-all">সব</button>
                     <button class="tag" data-tag="acrylic">অ্যাক্রিলিক</button>
                     <button class="tag" data-tag="pastel">প্যাস্টেল</button>
                     <button class="tag" data-tag="watercolor">জলরঙ</button>
                     <button class="tag" data-tag="pencil">পেন্সিল</button>
                     <button class="tag" data-tag="sketch">স্কেচ</button>
                     <button class="tag" data-tag="other">অন্যান্য</button>
                  </div>
                  <button class="scroll-btn right-arrow" aria-label="ট্যাগ ডানদিকে স্ক্রল"></button>
               </div>

               <div class="image-container" data-testid="paintings-grid">
                  <!-- cards injected by paintings.js -->
               </div>
            </div>
         </section>

         <section id="publications">
            <div class="content">
               <h2>আমার প্রকাশনা</h2>
               <div class="publication-container">
                  <div class="publication">
                     <iframe src="/publications/Jagriti_2024.pdf" title="জাগৃতি ২০২৪ — প্রতিভা দেবশর্মা"></iframe>
                  </div>
                  <div class="publication">
                     <iframe src="/publications/JAGRITI_2025.pdf" title="জাগৃতি ২০২৫ — প্রতিভা দেবশর্মা"></iframe>
                  </div>
               </div>
            </div>
         </section>
      </main>

      <!-- ===== Fullscreen lightbox ===== -->
      <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" data-testid="lightbox">
         <button class="lb-icon-btn lb-close" data-close-modal aria-label="বন্ধ করুন" data-testid="lightbox-close">
            <i class="fas fa-times"></i>
         </button>
         <button id="lightbox-prev" class="lb-nav lb-nav-prev" aria-label="আগের চিত্রকর্ম" data-testid="lightbox-prev">
            <i class="fas fa-chevron-left"></i>
         </button>
         <button id="lightbox-next" class="lb-nav lb-nav-next" aria-label="পরের চিত্রকর্ম" data-testid="lightbox-next">
            <i class="fas fa-chevron-right"></i>
         </button>

         <div class="lb-stage">
            <img id="lightbox-img" class="lb-image" alt="" data-testid="lightbox-image"/>
         </div>

         <div class="lb-footer">
            <div class="lb-meta">
               <span id="lightbox-title" class="lb-title" data-testid="lightbox-title"></span>
               <span id="lightbox-counter" class="lb-counter" data-testid="lightbox-counter"></span>
            </div>
            <button id="lightbox-info-btn" class="lb-info-btn" data-testid="lightbox-info-btn">
               <i class="fas fa-info-circle"></i> বিস্তারিত দেখুন
            </button>
         </div>

         <div id="lightbox-thumbs" class="lb-thumbs"></div>
      </div>

      <!-- ===== Info modal ===== -->
      <div id="info-modal" class="info-modal" role="dialog" aria-modal="true" data-testid="info-modal">
         <button class="lb-icon-btn lb-close" data-close-modal aria-label="বন্ধ করুন" data-testid="info-close">
            <i class="fas fa-times"></i>
         </button>
         <button id="info-prev" class="lb-nav lb-nav-prev" aria-label="আগের চিত্রকর্ম" data-testid="info-prev">
            <i class="fas fa-chevron-left"></i>
         </button>
         <button id="info-next" class="lb-nav lb-nav-next" aria-label="পরের চিত্রকর্ম" data-testid="info-next">
            <i class="fas fa-chevron-right"></i>
         </button>

         <div class="info-card" data-testid="info-card">
            <div class="info-media">
               <img id="info-hero-img" class="info-hero-img" alt="" data-testid="info-hero-image"/>
               <div id="info-photos" class="info-photos"></div>
            </div>
            <div class="info-body">
               <h2 id="info-title" class="info-title" data-testid="info-title"></h2>

               <div id="info-tags" class="info-tags-row" data-testid="info-tags"></div>

               <dl class="info-grid">
                  <div><dt>বছর</dt><dd id="info-year" data-testid="info-year"></dd></div>
                  <div><dt>শ্রেণী</dt><dd id="info-category" data-testid="info-category"></dd></div>
                  <div><dt>মাপ</dt><dd id="info-dimensions" data-testid="info-dimensions"></dd></div>
                  <div><dt>মাধ্যম</dt><dd id="info-medium" data-testid="info-medium"></dd></div>
                  <div id="info-price-row"><dt>মূল্য</dt><dd id="info-price" data-testid="info-price"></dd></div>
               </dl>

               <h3 class="info-section-title">এই কাজ সম্পর্কে</h3>
               <p id="info-description" class="info-description" data-testid="info-description"></p>

               <div class="info-actions">
                  <button id="info-view-btn" class="info-view-btn" data-testid="info-view-btn">
                     <i class="fas fa-expand"></i> পূর্ণস্ক্রিনে দেখুন
                  </button>
                  <button id="info-enquire-btn" class="info-enquire-btn" data-testid="info-enquire-btn">
                     <i class="fab fa-whatsapp"></i> হোয়াটসঅ্যাপে যোগাযোগ
                  </button>
               </div>
            </div>
         </div>
      </div>

      <footer>
         <p></p>
      </footer>
   </body>
</html>
