   <body>
      <div id="header-container"></div>
      <main>
         <section id="contact">
            <h1>যোগাযোগ করুন</h1>
            <div class="contact-container">
               <form action="https://docs.google.com/forms/d/1O9eXKaYBQcA1n9RoW9Bek0MYoEK5-Nt0C0SWqOt5ewo/formResponse" method="POST" onsubmit="handleSubmit(event)" data-testid="contact-form">
                  <label for="name" class="required-label">নাম</label>
                  <input type="text" id="name" name="entry.2005620554" required data-testid="contact-name" />

                  <label for="email" class="required-label">ইমেল</label>
                  <input type="email" id="email" name="entry.1045781291" required data-testid="contact-email" />

                  <label for="phone">ফোন</label>
                  <input type="text" id="phone" name="entry.865688963" maxlength="12" pattern="\d{10,12}" data-testid="contact-phone" />

                  <label for="reason" class="required-label">আপনার বার্তা</label>
                  <textarea id="reason" name="entry.1065046570" rows="5" required data-testid="contact-query"></textarea>

                  <button type="submit" data-testid="contact-submit">বার্তা পাঠান</button>
               </form>
               <div id="contact-details"></div>
               <div id="social-media"></div>
            </div>
         </section>
      </main>
      <footer>
         <p></p>
      </footer>
   </body>
